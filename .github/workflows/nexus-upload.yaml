# Uploads a finished release zip to Nexus Mods as a new version of the existing file.
#
# The game's DLLs are not on GitHub, so CI cannot build the mod. The Mod Build Watcher builds it on your machine and
# publishes a GitHub release whose tag is the version (v1.0.1) with CollegeEducatedAutoEngineer-<version>.zip attached and the
# changelog as release notes. Publishing the release runs this workflow. It can also be run by hand from the Actions tab.
#
# One-time setup in the repo's Settings > Secrets and variables > Actions:
#   Secret    NEXUSMODS_API_KEY   your personal Nexus API key
#   Variable  NEXUSMODS_MOD_ID    the mod's global "Unique Mod ID" (25692494366679), NOT the 2007 in the page URL;
#                                 the v3 API answers "Mod not found" for the URL number
#   Variable  NEXUSMODS_FILE_ID   the Main file's File ID (8300982)
#
# Where the IDs are kept:
#   - Mod page > Files tab > "Advanced" on any file > API section: "File ID" and "Unique Mod ID".
#   - https://api.nexusmods.com/v3/games/railroader/mods/2007 (no key needed): "id" is the Unique Mod ID;
#     "game_scoped_id" is the URL number.
name: Upload to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload (for example v1.0.1)'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Get the release zip and notes
        id: rel
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "CollegeEducatedAutoEngineer-*.zip" --dir .
          ZIP="$(ls CollegeEducatedAutoEngineer-*.zip | head -n 1)"
          case "$ZIP" in
            "CollegeEducatedAutoEngineer-$VERSION.zip") ;;
            *) echo "Attached zip '$ZIP' does not match tag '$TAG'"; exit 1 ;;
          esac
          NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          {
            echo "version=$VERSION"
            echo "zip=$ZIP"
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          filename: ${{ steps.rel.outputs.zip }}
          display_name: College Educated AutoEngineer ${{ steps.rel.outputs.version }}
          version: ${{ steps.rel.outputs.version }}
          category: main
          changelog: ${{ steps.rel.outputs.notes }}
          update_mod_version: true
